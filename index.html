<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hush · procedural ASMR</title>
<style>
  :root{
    --lake:#1C2A33; --lake-2:#243640; --lake-3:#2E4450;
    --paper:#E6E1D3; --mist:#8A9BA5; --lilac:#B9A3E3; --moss:#8FB39A;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--lake);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.45}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 64px;display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:48px}
  @media (max-width:820px){.wrap{grid-template-columns:1fr;gap:32px}}
  h1{font-family:var(--serif);font-weight:400;font-size:64px;line-height:1;margin:0 0 8px;letter-spacing:-.01em}
  .lede{font-family:var(--serif);font-size:18px;line-height:1.55;color:var(--mist);margin:0 0 28px;max-width:34ch}
  .stage{align-self:start;min-width:0}
  @media (min-width:821px) and (min-height:760px){.stage{position:sticky;top:24px}}
  @media (max-width:820px){.stage{position:static} canvas{max-width:360px;margin:0 auto}}
  #map{touch-action:none}
  canvas{width:100%;aspect-ratio:1;display:block;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--lake-2) 0%,var(--lake) 70%)}
  .transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:20px}
  button.play{flex:none;font:inherit;font-size:16px;background:var(--lilac);color:var(--lake);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;font-weight:600}
  button.play[aria-pressed="true"]{background:var(--paper)}
  .note{color:var(--mist);font-size:13px}
  label.master{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--mist);font-size:13px}
  label.master input{flex:1;min-width:0}
  :focus-visible{outline:2px solid var(--lilac);outline-offset:3px}

  .sources{display:flex;flex-direction:column;min-width:0}
  .src{border-top:1px solid var(--lake-3);padding:18px 0}
  .src:last-child{border-bottom:1px solid var(--lake-3)}
  .src-head{display:flex;align-items:center;gap:14px}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .src h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;flex:1;min-width:0}
  .src p{margin:4px 0 0 26px;color:var(--mist);font-size:13px;max-width:52ch}
  .src[data-on="false"] .ctrls{opacity:.4}
  .ctrls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:14px 24px;margin:14px 0 0 26px}
  @media (max-width:480px){.ctrls,.src p{margin-left:0}}
  .ctrl{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mist);min-width:0}
  .ctrl span{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .ctrl span b{overflow:hidden;text-overflow:ellipsis}
  .ctrl span b{color:var(--paper);font-weight:500}
  input[type=range]{width:100%;margin:0;accent-color:var(--lilac)}
  details.filter{margin:14px 0 0 26px}
  details.filter summary{cursor:pointer;color:var(--mist);font-size:13px;padding:2px 0}
  details.filter summary b{color:var(--paper);font-weight:500}
  details.filter .ctrls{margin-left:0}
  .bode{display:block;width:100%;height:110px;margin:10px 0 2px;background:var(--lake-2);border-radius:6px}
  @media (max-width:480px){details.filter{margin-left:0}}
  .btn{font:inherit;font-size:13px;background:transparent;color:var(--paper);border:1px solid var(--lake-3);border-radius:999px;padding:6px 16px;cursor:pointer}
  .btn:hover{border-color:var(--mist)}
  .btn.rec{background:var(--lilac);color:var(--lake);border-color:var(--lilac)}
  .ctrl.driven span b{color:var(--lilac)}
  .pattern h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:22px 0 8px}
  .pattern .body{margin-left:26px}
  @media (max-width:480px){.pattern .body{margin-left:0}}
  .take{display:block;width:100%;height:90px;background:var(--lake-2);border-radius:6px;margin:12px 0 8px}
  input.pad{height:32px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  .plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .plist li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
  .plist canvas{flex:none;width:96px;height:32px;background:var(--lake-2);border-radius:4px}
  .plist input[type=text]{flex:1;min-width:0;font:inherit;font-size:13px;background:transparent;color:var(--paper);border:0;border-bottom:1px solid var(--lake-3);padding:3px 0}
  .plist .meta{flex:1;min-width:0;font-size:13px;color:var(--mist)}
  .plist .meta b{color:var(--paper);font-weight:500}
  .empty{color:var(--mist);font-size:13px;margin:0}
  .playing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .playing li{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(110px,160px) auto;gap:8px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--lake-3)}
  .playing li:last-child{border-bottom:1px solid var(--lake-3)}
  @media (max-width:560px){.playing li{grid-template-columns:96px minmax(0,1fr)} .playing li .ctrl, .playing li .btn{grid-column:span 1}}
  .curve{position:relative;height:40px;background:var(--lake-2);border-radius:4px;overflow:hidden}
  .curve canvas{display:block;width:100%;height:100%}
  .curve .head{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--paper);opacity:.85;left:0}
  .playing .meta{min-width:0;font-size:13px;color:var(--mist);line-height:1.35}
  .playing .meta b{color:var(--paper);font-weight:500}
  .playing .meta .now{color:var(--lilac)}
  .stopall{margin-top:12px}
  .np{padding:14px 0;border-top:1px solid var(--lake-3)}
  .np:last-of-type{border-bottom:1px solid var(--lake-3)}
  .np-head{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(90px,180px) auto;gap:10px 14px;align-items:center}
  @media (max-width:480px){.np-head{grid-template-columns:auto minmax(0,1fr) auto} .np-head .vol{grid-column:1/-1;order:5}}
  .np-name{justify-self:start;max-width:100%;font:inherit;font-family:var(--serif);font-size:20px;color:var(--paper);background:none;border:0;padding:0;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np-name:hover{text-decoration:underline}
  .np .playing{margin:10px 0 0 26px}
  @media (max-width:480px){.np .playing{margin-left:0}}
  .np .playing li:last-child{border-bottom:0}
  .np .none{margin:6px 0 0 26px}
  .np-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  body{overflow-x:clip}   /* clip, not hidden: hidden would break the sticky map and menu */
  .wrap>*{min-width:0}
  .jump{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:4px;background:var(--lake);border-bottom:1px solid var(--lake-3)}
  .jump .lbl{font-size:13px;color:var(--mist);flex:none}
  .menu{position:relative;flex:1;min-width:0}
  .menu-btn{width:100%;display:flex;align-items:center;gap:10px;font:inherit;font-size:14px;color:var(--paper);background:var(--lake-2);border:1px solid var(--lake-3);border-radius:6px;padding:8px 12px;cursor:pointer;text-align:left}
  .menu-btn:hover{border-color:var(--mist)}
  .menu-btn .mlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu-btn svg{flex:none;transition:transform .15s}
  .menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
  .menu-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:10;margin:0;padding:4px;list-style:none;background:var(--lake-2);border:1px solid var(--lake-3);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.35);max-height:70vh;overflow:auto}
  .menu-list li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}
  .menu-list li:hover,.menu-list li:focus{background:var(--lake-3);outline:none}
  .menu-list li[aria-selected="true"]{color:var(--lilac);font-weight:600}
  .mdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--moss);visibility:hidden}
  .mdot.on{visibility:visible}
  @media (prefers-reduced-motion:reduce){.menu-btn svg{transition:none}}
  .group{scroll-margin-top:64px}
  .group-title{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin:18px 0 6px}
  .group:first-of-type .group-title{margin-top:18px}
  details.settings{margin:10px 0 0 26px}
  details.settings>summary{cursor:pointer;color:var(--mist);font-size:13px;padding:2px 0}
  details.settings .ctrls, details.settings details.filter{margin-left:0}
  @media (max-width:480px){details.settings{margin-left:0}}
  select{width:100%;font:inherit;font-size:13px;background:var(--lake-2);color:var(--paper);border:1px solid var(--lake-3);border-radius:6px;padding:5px 8px}
  .switch{flex:none;appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;background:var(--lake-3);position:relative;cursor:pointer;margin:0}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mist);transition:transform .15s}
  .switch:checked{background:var(--moss)}
  .switch:checked::after{transform:translateX(18px);background:var(--paper)}
  @media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="stage">
    <h1>Hush</h1>
    <canvas id="map" width="720" height="720" aria-label="Top-down view of your head and where each sound is. Drag a dot to move that sound."></canvas>
    <div class="transport">
      <button class="play" id="play" aria-pressed="false">Start listening</button>
      <span class="note" id="status">Binaural panning only works on headphones.</span>
    </div>
    <label class="master">Volume <input type="range" id="master" min="0" max="1" step="0.01" value="0.8"></label>
  </section>
  <section class="sources" id="sources"></section>
</div>

<script>
/* ============================================================
   Hush: procedural ASMR engine (Web Audio API)
   - every sound is synthesized: noise + filters + stochastic timing
   - each source goes through its own HRTF PannerNode
   - a Worker clock schedules events 250 ms ahead (survives background tabs)
   - short, frequent events (drops, taps, crackles) are pre-rendered once into
     banks of random variants, so playing one costs a buffer source + a gain
   ============================================================ */
let ctx=null, master=null, WHITE=null, BROWN=null, clock=null, ready=false;
const BANKS={}, BAKING={};   // pre-rendered sounds per generator, baked the first time a sound is used
const PARAMS=[];          // every slider of every sound, so patterns can drive them
const SELECTS=[];         // every dropdown of every sound
let onPlaceByHand=null;
let renderNow=null;       // set by the pattern panel: redraws the Now playing section   // set by the pattern panel: drops position patterns when a dot is dragged
const LINKS=new Map();    // "soundId.key" -> active pattern link
const el=(tag,props={},...kids)=>{const e=Object.assign(document.createElement(tag),props); e.append(...kids); return e};   // tiny DOM builder
const rand=Math.random, rint=n=>Math.floor(rand()*n), pick=a=>a[rint(a.length)];
const expRand=rate=>-Math.log(1-rand())/rate;          // Poisson inter-arrival time
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const bq=(type,frequency,Q=1)=>new BiquadFilterNode(ctx,{type,frequency,Q});
const gn=gain=>new GainNode(ctx,{gain});

function makeNoise(secs,brown,c=ctx){
  const n=Math.floor(c.sampleRate*secs), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  let last=0;
  for(let i=0;i<n;i++){const w=rand()*2-1; if(brown){last=(last+0.02*w)/1.02; d[i]=last*3.5}else d[i]=w}
  return b;
}
const NOISE={};
const toneHz=x=>500*Math.pow(32,x);

/* ---------------- per-source filter (high-pass + low-pass) ----------------
   Four biquads in series: HP, HP, LP, LP. A single biquad is a 2-pole filter
   (12 dB/octave, like two RC stages); two in series give 24 dB/octave.
   Unused stages are made transparent: a high-pass at 0 Hz and a low-pass at
   Nyquist both reduce to an identity filter.
   Note: for lowpass/highpass BiquadFilterNodes, Q is specified in dB. */
const FILTER_KEYS=new Set(['hp','lp','slope','res']);
const hpHz=x=>20*Math.pow(400,x);          // 20 Hz .. 8 kHz, log scale
const lpHz=x=>200*Math.pow(100,x);         // 200 Hz .. 20 kHz, log scale
const fmtHz=f=>f<1000?Math.round(f)+' Hz':(f/1000).toFixed(f<10000?1:0)+' kHz';
const dB=q=>20*Math.log10(q);
function filterSettings(p,nyq){
  const hpOn=p.hp>0.001, lpOn=p.lp<0.999, four=p.slope==='24';
  const peak=p.res*11;                                   // resonance adds to the last stage's Q
  // Butterworth Q values: 0.7071 for 2 poles; 0.5412 and 1.3066 for 4 poles
  const qs=four?[0.5412,1.3066+peak]:[0.7071+peak,0.7071];
  const flat=[0.7071,0.7071];
  const hq=hpOn?qs:flat, lq=lpOn?qs:flat;
  const fh=hpOn?Math.min(hpHz(p.hp),nyq):0, fl=lpOn?Math.min(lpHz(p.lp),nyq):nyq;
  return [
    {f:fh, q:dB(hq[0])},
    {f:hpOn&&four?fh:0, q:dB(hq[1])},
    {f:fl, q:dB(lq[0])},
    {f:lpOn&&four?fl:nyq, q:dB(lq[1])}
  ];
}
function applyFilter(v,instant){
  const S=filterSettings(v.p,ctx.sampleRate/2), now=ctx.currentTime;
  v.flt.forEach((f,i)=>{
    if(instant){f.frequency.value=S[i].f; f.Q.value=S[i].q}
    else{f.frequency.setTargetAtTime(S[i].f,now,0.03); f.Q.setTargetAtTime(S[i].q,now,0.03)}
  });
}
function filterSummary(p){
  const parts=[];
  if(p.hp>0.001) parts.push('high-pass '+fmtHz(hpHz(p.hp)));
  if(p.lp<0.999) parts.push('low-pass '+fmtHz(lpHz(p.lp)));
  if(!parts.length) return 'off';
  return parts.join(', ')+', '+p.slope+' dB/oct'+(p.res>0.01?', resonant':'');
}
// 8 s stereo loop (independent channels), seamless crossfaded loop point, RMS-normalised
function colorNoise(color){
  if(NOISE[color]) return NOISE[color];
  const sr=ctx.sampleRate, n=sr*8, fade=Math.floor(sr*0.5), buf=ctx.createBuffer(2,n,sr);
  for(let ch=0;ch<2;ch++){
    const x=new Float32Array(n+fade);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,br=0,pw=0,pp=0;
    for(let i=0;i<n+fade;i++){
      const w=rand()*2-1;
      // Paul Kellet's pink filter (-3 dB/oct)
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
      b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      const pink=b0+b1+b2+b3+b4+b5+b6+w*0.5362; b6=w*0.115926;
      br=(br+0.02*w)/1.02;                                  // brown: leaky random walk (-6 dB/oct)
      x[i]= color==='white'?w : color==='brown'?br
          : color==='blue'?pink-pp                          // differentiated pink: +3 dB/oct
          : color==='violet'?w-pw                           // differentiated white: +6 dB/oct
          : pink;                                           // pink, and grey (EQ'd later)
      pw=w; pp=pink;
    }
    let m=0; for(const y of x) m+=y; m/=x.length;
    const d=buf.getChannelData(ch);
    for(let i=0;i<n;i++) d[i]=x[i]-m;
    for(let i=0;i<fade;i++){const a=i/fade; d[i]=(x[i]-m)*Math.sqrt(a)+(x[n+i]-m)*Math.sqrt(1-a)}
    let e=0; for(let i=0;i<n;i++) e+=d[i]*d[i];
    const k=0.18/Math.sqrt(e/n); for(let i=0;i<n;i++) d[i]*=k;
  }
  return NOISE[color]=buf;
}
function loop(v,buf){
  const s=new AudioBufferSourceNode(ctx,{buffer:buf,loop:true});
  s.start(0,rand()*buf.duration); v.loops.push(s); return s;
}
// short enveloped noise event -> dest; extra nodes are disconnected when it ends
function burst(t,dur,peak,dest,{attack=0.001,tail=0.02,cleanup=[],c=ctx,noise=WHITE}={}){
  const s=new AudioBufferSourceNode(c,{buffer:noise}), g=new GainNode(c,{gain:0});
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+attack);
  g.gain.exponentialRampToValueAtTime(1e-4,t+Math.max(dur,attack+0.002));
  s.connect(g).connect(dest);
  s.start(t,rand()*(noise.duration-2)); s.stop(t+dur+tail);
  s.onended=()=>{s.disconnect();g.disconnect();cleanup.forEach(n=>n.disconnect())};
}
// Render n variants of a short sound offline, in one pass, and slice them into buffers.
// build(oc, noise, t, out) schedules one variant starting at time t.
async function bakeBank(n,slot,build){
  const sr=ctx.sampleRate, L=Math.round(slot*sr);
  const oc=new OfflineAudioContext(1,n*L,sr), noise=makeNoise(4,false,oc);
  for(let k=0;k<n;k++) build(oc,noise,k*slot,oc.destination);
  const data=(await oc.startRendering()).getChannelData(0);
  return Array.from({length:n},(_,k)=>{const b=ctx.createBuffer(1,L,sr); b.copyToChannel(data.subarray(k*L,(k+1)*L),0); return b});
}
// Offline tone: oscillator with optional glide (exponential), vibrato, 2nd harmonic and hold.
function tone(c,t,dur,dest,{f0,f1=f0,peak=1,attack=0.002,type='sine',vib=0,vibHz=6,harm=0,hold=0}){
  const g=new GainNode(c,{gain:0});
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+attack);
  if(hold>0) g.gain.setValueAtTime(peak,t+Math.max(attack,dur*hold));
  g.gain.exponentialRampToValueAtTime(1e-4,t+dur);
  const voice=(mult,amp)=>{
    const o=new OscillatorNode(c,{type,frequency:f0*mult});
    o.frequency.setValueAtTime(f0*mult,t);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1*mult,t+dur);
    if(vib){const l=new OscillatorNode(c,{frequency:vibHz}); l.connect(new GainNode(c,{gain:vib*f0*mult})).connect(o.frequency); l.start(t); l.stop(t+dur+0.02)}
    o.connect(new GainNode(c,{gain:amp})).connect(g); o.start(t); o.stop(t+dur+0.02);
  };
  voice(1,1); if(harm) voice(2,harm);
  g.connect(dest);
}
async function ensureBank(id){
  if(!BAKE[id]||BANKS[id]) return;
  BAKING[id]??=BAKE[id]().then(b=>BANKS[id]=b);
  await BAKING[id];
}
// play a pre-rendered variant into a voice (rate > 1 = higher and shorter)
function oneShot(v,buf,t,gain,rate=1){
  const s=new AudioBufferSourceNode(ctx,{buffer:buf,playbackRate:rate}), g=gn(gain);
  s.connect(g).connect(v.inp); s.start(t);
  s.onended=()=>{s.disconnect();g.disconnect()};
}

/* ---------------- sound generators ---------------- */
const MATERIALS={
  wood:   {f:[680,1720,2950], q:[18,22,25],   g:[9,6,4],  tail:0.15},
  plastic:{f:[1300,3100,5200],q:[25,30,30],   g:[8,5,3],  tail:0.15},
  glass:  {f:[2300,5900,9800],q:[120,140,150],g:[14,8,5], tail:0.6}
};
// whispered formants (F1,F2,F3), slightly raised vs voiced speech
const VOWELS=[[800,1200,2600],[550,1900,2600],[320,2400,3100],[600,900,2500],[350,850,2300]];
// soft consonants only: gentle fricatives, breathy onsets, very light stops
const CONS=[
  {type:'fric',f:5000,q:1.2,a:0.10},{type:'fric',f:2400,q:1.2,a:0.13},{type:'fric',f:3500,q:0.6,a:0.06},
  {type:'stop',f:3200,a:0.06},{type:'stop',f:1600,a:0.06},
  {type:'h'},{type:'h'},{type:'none'}
];

/* ---------------- music ----------------
   All instruments share one key and scale, so they always sound good together. */
const NOTE_NAMES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const SCALES={
  majPent:['Major pentatonic',[0,2,4,7,9]],
  minPent:['Minor pentatonic',[0,3,5,7,10]],
  major:['Major',[0,2,4,5,7,9,11]],
  minor:['Minor',[0,2,3,5,7,8,10]],
  dorian:['Dorian',[0,2,3,5,7,9,10]]
};
const MUSIC={root:2,scale:'majPent'};          // D major pentatonic
const mtof=m=>440*Math.pow(2,(m-69)/12);
const scaleLen=()=>SCALES[MUSIC.scale][1].length;
// MIDI note of scale degree `deg` (0 = tonic, may be negative or above one octave) above C `base`
function scaleMidi(base,deg){
  const sc=SCALES[MUSIC.scale][1], n=sc.length;
  return base+MUSIC.root+sc[((deg%n)+n)%n]+12*Math.floor(deg/n);
}
// Struck resonator played live: each mode is [ratio, amplitude, decay τ (s), beat (Hz)].
// A non-zero beat splits the mode into two slightly detuned partials, as in a real bowl.
function modalStrike(v,t,f,modes,amp,decay=1){
  const out=gn(1); out.connect(v.inp);
  let live=0;
  for(const [ratio,a,tau,beat] of modes){
    const fm=f*ratio; if(fm>16000) continue;
    const T=tau*decay, pair=beat?[-beat/2,beat/2]:[0];
    for(const df of pair){
      const o=new OscillatorNode(ctx,{frequency:fm+df}), g=gn(0);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(amp*a/pair.length,t+0.003);
      g.gain.setTargetAtTime(0,t+0.003,T);
      o.connect(g).connect(out); o.start(t); o.stop(t+0.003+5*T);   // stop at about −43 dB
      live++; v.loops.push(o);
      o.onended=()=>{
        o.disconnect(); g.disconnect();
        const i=v.loops.indexOf(o); if(i>=0) v.loops.splice(i,1);
        if(--live===0) out.disconnect();
      };
    }
  }
}
// Karplus–Strong plucked strings, computed directly into buffers:
// y[n] = ρ·(y[n−N] + y[n−N−1])/2, period N + ½ samples, ρ chosen for a decay time τ
function ksBank(midis,dur){
  const sr=ctx.sampleRate, L=Math.round(dur*sr), fade=Math.round(0.08*sr), bank={midis:[],bufs:[]};
  for(const m of midis){
    const N=Math.max(2,Math.round(sr/mtof(m)-0.5)), f=sr/(N+0.5);
    const tau=clamp(2.2*Math.sqrt(220/f),0.6,4), rho=Math.exp(-1/(f*tau));
    const b=ctx.createBuffer(1,L,sr), y=b.getChannelData(0);
    let lp=0, mean=0;
    for(let i=0;i<=N;i++){lp=0.6*lp+0.4*(rand()*2-1); y[i]=lp; mean+=lp}   // softened pluck
    mean/=N+1; for(let i=0;i<=N;i++) y[i]-=mean;
    for(let n=N+1;n<L;n++) y[n]=rho*0.5*(y[n-N]+y[n-N-1]);
    let pk=1e-9; for(let n=0;n<L;n++) pk=Math.max(pk,Math.abs(y[n]));
    for(let n=0;n<L;n++) y[n]*=0.6/pk;
    for(let n=0;n<fade;n++) y[L-1-n]*=n/fade;
    bank.midis.push(69+12*Math.log2(f/440)); bank.bufs.push(b);     // true pitch of the integer delay
  }
  return bank;
}
// play the nearest pre-rendered note, shifted to the exact pitch
function playNote(v,bank,midi,gain,t,cents=0){
  let k=0;
  for(let i=1;i<bank.midis.length;i++) if(Math.abs(bank.midis[i]-midi)<Math.abs(bank.midis[k]-midi)) k=i;
  oneShot(v,bank.bufs[k],t,gain,Math.pow(2,(midi-bank.midis[k]+cents/100)/12));
}

const microClicks=(c,noise,t,out)=>{            // wet, sticky micro-clicks
  const n=4+Math.floor(rand()*7);
  for(let i=0;i<n;i++){
    const h=new BiquadFilterNode(c,{type:'highpass',frequency:2000+rand()*3500,Q:0.7}); h.connect(out);
    burst(t+rand()*0.05,0.0005+rand()*0.0012,0.2+0.8*rand()**2,h,{c,noise});
  }
};
const modal=(c,out,modes)=>{                      // parallel resonators -> returns their shared input
  const g=new GainNode(c);
  modes.forEach(([f,q,a])=>g.connect(new BiquadFilterNode(c,{type:'bandpass',frequency:f,Q:q})).connect(new GainNode(c,{gain:a})).connect(out));
  return g;
};
const BAKE={
  harp:async()=>ksBank([44,48,52,56,60,64,68,72,76,80,84,88],2.5),
  rain:()=>bakeBank(48,0.07,(c,noise,t,out)=>{
    const f=new BiquadFilterNode(c,{type:'bandpass',frequency:1800+rand()*5500,Q:3+rand()*6}); f.connect(out);
    burst(t,0.015+rand()*0.035,1,f,{c,noise});
  }),
  fire:()=>bakeBank(48,0.03,(c,noise,t,out)=>{
    const f=new BiquadFilterNode(c,{type:'highpass',frequency:1200+rand()*3000,Q:0.7}); f.connect(out);
    burst(t,0.0015+rand()*0.006,1,f,{c,noise});
  }),
  tap:async()=>{
    const mats=Object.entries(MATERIALS);
    const banks=await Promise.all(mats.map(([,M])=>bakeBank(16,0.003+M.tail+0.05,(c,noise,t,out)=>
      burst(t,0.003,1,modal(c,out,M.f.map((f,i)=>[f,M.q[i],M.g[i]])),{c,noise,tail:M.tail}))));
    return Object.fromEntries(mats.map(([k],i)=>[k,banks[i]]));
  },
  // water drop: impact click, then a Minnaert bubble whose pitch rises as it nears the surface
  drops:()=>bakeBank(32,0.14,(c,noise,t,out)=>{
    const h=new BiquadFilterNode(c,{type:'highpass',frequency:2500}); h.connect(out);
    burst(t,0.002,0.25,h,{c,noise});
    const f0=450+rand()*1100;
    tone(c,t+0.004,0.05+rand()*0.06,out,{f0,f1:f0*(1.5+rand()*0.8),peak:0.6,attack:0.001});
  }),
  mouth:async()=>{
    const [click,smack,wet]=await Promise.all([
      // tongue click: impulse into the mouth cavity's two main resonances
      bakeBank(16,0.08,(c,noise,t,out)=>{const f=1100+rand()*1600; burst(t,0.002,1,modal(c,out,[[f,8,6],[f*1.9,6,2.5]]),{c,noise,tail:0.06})}),
      // lip smack: noise through a resonance that falls quickly as the lips part
      bakeBank(16,0.1,(c,noise,t,out)=>{
        const bp=new BiquadFilterNode(c,{type:'bandpass',frequency:2600,Q:1.8}), lp=new BiquadFilterNode(c,{type:'lowpass',frequency:4000});
        bp.frequency.setValueAtTime(2200+rand()*800,t); bp.frequency.exponentialRampToValueAtTime(500+rand()*400,t+0.04);
        bp.connect(lp).connect(out); burst(t,0.03+rand()*0.02,1.2,bp,{c,noise,attack:0.003});
      }),
      bakeBank(16,0.08,microClicks)
    ]);
    return {click,smack,wet};
  },
  squish:async()=>{
    const [bub,wet]=await Promise.all([
      bakeBank(32,0.07,(c,noise,t,out)=>{const f0=250+rand()*600; tone(c,t,0.015+rand()*0.04,out,{f0,f1:f0*(1.2+rand()*0.9),attack:0.001})}),
      bakeBank(16,0.08,microClicks)
    ]);
    return {bub,wet};
  },
  crack:async()=>{
    const [crinkle,ice,snap]=await Promise.all([
      bakeBank(48,0.012,(c,noise,t,out)=>{
        const f=new BiquadFilterNode(c,rand()<0.5?{type:'highpass',frequency:2500+rand()*5000,Q:0.7}:{type:'bandpass',frequency:3000+rand()*5000,Q:2});
        f.connect(out); burst(t,0.0008+rand()*0.003,1,f,{c,noise,tail:0.005});
      }),
      // ice: sharp crack, low thump, and a falling "pew": flexural waves in ice are
      // dispersive, so high frequencies arrive first
      bakeBank(16,0.6,(c,noise,t,out)=>{
        const h=new BiquadFilterNode(c,{type:'highpass',frequency:1500}); h.connect(out);
        burst(t,0.003,1,h,{c,noise});
        tone(c,t+0.001,0.08,out,{f0:140,f1:55,peak:0.6,attack:0.001});
        const d=0.15+rand()*0.3;
        tone(c,t+0.002,d,out,{f0:2500+rand()*2500,f1:220+rand()*300,peak:0.35});
        if(rand()<0.5) tone(c,t+0.05+rand()*0.1,d*0.7,out,{f0:1800+rand()*2000,f1:200+rand()*200,peak:0.15});
      }),
      // twig: broadband snap exciting short woody modes, then a smaller second break
      bakeBank(16,0.3,(c,noise,t,out)=>{
        const j=0.85+rand()*0.3, g=modal(c,out,[[850*j,10,5],[2100*j,14,3.5],[3500*j,16,2]]);
        const h=new BiquadFilterNode(c,{type:'highpass',frequency:1200}); h.connect(out);
        const t2=t+0.012+rand()*0.05;
        burst(t,0.0015,1,g,{c,noise,tail:0.1}); burst(t,0.002,0.6,h,{c,noise});
        burst(t2,0.001,0.5,g,{c,noise,tail:0.1}); burst(t2,0.0015,0.3,h,{c,noise});
      })
    ]);
    return {crinkle,ice,snap};
  },
  // one purr pulse: a low noise puff plus a short low tone
  purr:()=>bakeBank(12,0.07,(c,noise,t,out)=>{
    const lp=new BiquadFilterNode(c,{type:'lowpass',frequency:500+rand()*300,Q:0.7}); lp.connect(out);
    burst(t,0.035,1,lp,{c,noise,attack:0.006});
    tone(c,t,0.04,out,{f0:85+rand()*20,f1:60,peak:0.7,attack:0.006});
  }),
  // one cricket pulse: a nearly pure tone around 4.5 kHz
  crickets:()=>bakeBank(8,0.03,(c,noise,t,out)=>tone(c,t,0.018,out,{f0:4200+rand()*700,attack:0.002,hold:0.6})),
  birds:async()=>{
    const [up,down,whistle,note]=await Promise.all([
      bakeBank(8,0.12,(c,n,t,o)=>tone(c,t,0.07+rand()*0.04,o,{f0:2200+rand()*800,f1:4500+rand()*1500,attack:0.005,hold:0.5,harm:0.08})),
      bakeBank(8,0.14,(c,n,t,o)=>tone(c,t,0.08+rand()*0.05,o,{f0:5500+rand()*1000,f1:2500+rand()*700,attack:0.004,hold:0.5,harm:0.08})),
      bakeBank(8,0.3,(c,n,t,o)=>tone(c,t,0.18+rand()*0.08,o,{f0:2800+rand()*900,peak:0.8,attack:0.02,hold:0.75,vib:0.02,vibHz:18+rand()*10,harm:0.05})),
      bakeBank(8,0.05,(c,n,t,o)=>{const f=4000+rand()*1200; tone(c,t,0.03,o,{f0:f*1.1,f1:f*0.9,attack:0.002,hold:0.3})})
    ]);
    return {up,down,whistle,note};
  },
  // frog croak ("rib-bit"): a buzzy source gated by a fast pulse train, through a throat resonance
  frogs:()=>bakeBank(16,1.0,(c,noise,t,out)=>{
    const f0=180+rand()*140, o=new OscillatorNode(c,{type:'sawtooth',frequency:f0}), g=new GainNode(c,{gain:0});
    o.connect(new BiquadFilterNode(c,{type:'bandpass',frequency:700+rand()*500,Q:2.5}))
     .connect(new BiquadFilterNode(c,{type:'lowpass',frequency:2500})).connect(g).connect(out);
    const pr=28+rand()*16, parts=rand()<0.6?2:1; let tt=t;
    for(let q=0;q<parts;q++){
      const n=5+Math.floor(rand()*7);
      for(let i=0;i<n;i++){g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(1,tt+0.002); g.gain.exponentialRampToValueAtTime(0.02,tt+0.8/pr); tt+=1/pr}
      tt+=0.06;
    }
    g.gain.setValueAtTime(0,tt);
    o.frequency.setValueAtTime(f0,t); o.frequency.linearRampToValueAtTime(f0*0.9,tt);
    o.start(t); o.stop(tt+0.01);
  })
};

const GEN={
  rain:{
    build(v){
      const s=loop(v,WHITE), f=bq('bandpass',1100,0.5), h=bq('highshelf',3000), g=gn(0.12);
      h.gain.value=-6; s.connect(f).connect(h).connect(g).connect(v.inp); v.nodes.push(f,h,g);
    },
    schedule(v,t1){
      while(v.next<t1){
        oneShot(v,pick(BANKS.rain),v.next,0.02+0.4*rand()**2,0.85+rand()*0.3);
        v.next+=expRand(v.p.density);
      }
    }
  },
  tap:{
    build(){},
    schedule(v,t1){
      const bank=BANKS.tap[v.p.material], r=v.p.rate;
      while(v.next<t1){
        oneShot(v,pick(bank),v.next,0.5+rand()*0.5,1+(rand()-0.5)*0.06);   // playbackRate detunes all modes together
        v.next+= rand()<0.78 ? (0.07+rand()*0.12)/r : (0.35+rand()*0.9)/r;   // taps come in clusters
      }
    }
  },
  brush:{
    build(v){
      const s=loop(v,WHITE), bp=bq('bandpass',3000,0.9), hp=bq('highpass',700), g=gn(0);
      s.connect(bp).connect(hp).connect(g).connect(v.inp); v.nodes.push(bp,hp,g); v.bp=bp; v.sg=g;
    },
    schedule(v,t1){
      while(v.next<t1){
        const t=v.next, D=(0.3+rand()*0.4)/Math.sqrt(v.p.rate), A=0.25+rand()*0.2, up=rand()<0.5;
        v.sg.gain.setValueAtTime(0,t);
        v.sg.gain.linearRampToValueAtTime(A,t+D*0.15);
        v.sg.gain.linearRampToValueAtTime(A*0.7,t+D*0.75);
        v.sg.gain.linearRampToValueAtTime(0,t+D);
        v.bp.frequency.setValueAtTime(up?2200:4800,t);
        v.bp.frequency.linearRampToValueAtTime(up?4800:2200,t+D);   // stroke direction = spectral sweep
        v.next=t+D+(0.04+rand()*0.25)/v.p.rate;
      }
    }
  },
  fire:{
    build(v){
      const s=loop(v,BROWN), lp=bq('lowpass',380,0.7), g=gn(0.45);
      s.connect(lp).connect(g).connect(v.inp); v.nodes.push(lp,g);
    },
    schedule(v,t1){
      while(v.next<t1){
        const n=rand()<0.2?3+rint(4):1;
        for(let k=0;k<n;k++) oneShot(v,pick(BANKS.fire),v.next+(k?rand()*0.06:0),0.05+0.9*rand()**3,0.9+rand()*0.2);   // heavy-tailed loudness
        v.next+=expRand(v.p.intensity);
      }
    }
  },
  noise:{
    build(v){
      v.cur=null;
      v.tone=bq('lowpass',toneHz(v.p.tone),0.5); v.swell=gn(1);
      v.lfo=new OscillatorNode(ctx,{frequency:0.07}); v.lfoG=gn(0);   // ~14 s "waves" swell
      v.lfo.connect(v.lfoG).connect(v.swell.gain); v.lfo.start(); v.loops.push(v.lfo);
      v.tone.connect(v.swell).connect(v.inp); v.nodes.push(v.tone,v.swell,v.lfoG);
      this.setSwell(v); this.setColor(v,0.01);
    },
    setColor(v,fade){
      const now=ctx.currentTime, src=new AudioBufferSourceNode(ctx,{buffer:colorNoise(v.p.color),loop:true}), g=gn(0), extra=[];
      src.start(now,rand()*8); v.loops.push(src); src.connect(g);
      let tail=g;
      if(v.p.color==='grey'){   // rough inverse equal-loudness curve on top of pink
        const ls=new BiquadFilterNode(ctx,{type:'lowshelf',frequency:200,gain:8});
        const pk=new BiquadFilterNode(ctx,{type:'peaking',frequency:3000,Q:0.8,gain:-7});
        g.connect(ls).connect(pk); tail=pk; extra.push(ls,pk);
      }
      tail.connect(v.tone); v.nodes.push(g,...extra);
      g.gain.setTargetAtTime(1,now,fade);
      if(v.cur){
        const old=v.cur, loops=v.loops, nodes=v.nodes, dead=[old.g,...old.extra];
        old.g.gain.setTargetAtTime(0,now,fade);
        setTimeout(()=>{
          try{old.src.stop()}catch(e){}
          dead.forEach(n=>n.disconnect());
          loops.splice(loops.indexOf(old.src),1);
          dead.forEach(n=>nodes.splice(nodes.indexOf(n),1));
        },fade*8000);
      }
      v.cur={src,g,extra};
    },
    setSwell(v){
      const now=ctx.currentTime, d=v.p.swell;
      v.swell.gain.setTargetAtTime(1-0.45*d,now,0.1);
      v.lfoG.gain.setTargetAtTime(0.45*d,now,0.1);
    },
    update(v,key){
      if(key==='color') this.setColor(v,0.25);
      else if(key==='tone') v.tone.frequency.setTargetAtTime(toneHz(v.p.tone),ctx.currentTime,0.05);
      else if(key==='swell') this.setSwell(v);
      else if(key==='spread'){v.stop(); v.start()}
    },
    schedule(){}
  },
  drops:{
    build(){},
    schedule(v,t1){

  squish:{

        v.sg.gain.setValueAtTime(0,t);

      const now=ctx.currentTime, tF=v.p.temp*9/5+32, period=60/Math.max(20,4*(tF-50)+40);
      const cr=v.state.cr, count=Math.round(v.p.count);
      while(cr.length<count) cr.push({next:now+rand()*period,b:rint(8),jit:0.92+0.16*rand(),n:3+rint(2),g:0.5+0.5*rand()});
      cr.length=count;
      for(const c of cr){
        if(c.next<now-0.3) c.next=now+rand()*0.1;
        while(c.next<t1){
          for(let i=0;i<c.n;i++) oneShot(v,BANKS.crickets[c.b],c.next+i*0.035,c.g*(i?1:0.8),c.jit);
          c.next+=period*c.jit*(0.97+0.06*rand());
        }
      }
      v.next=t1;
    }
  },
  birds:{
    song(){                                          // a short motif that the bird repeats
      return Array.from({length:3+rint(4)},()=>({type:pick(['up','down','whistle','trill']),b:rint(8),n:6+rint(7),gap:0.04+rand()*0.12}));
    },
    build(v){v.state={song:this.song()}},
    schedule(v,t1){
      const B=BANKS.birds, s=v.state, len={up:0.1,down:0.12,whistle:0.25};
      while(v.next<t1){
        if(rand()<0.15) s.song=this.song();
        let t=v.next; const pr=0.92+0.16*rand(), keep=Math.max(2,s.song.length-rint(2));
        for(const e of s.song.slice(0,keep)){
          if(e.type==='trill') for(let k=0;k<e.n;k++){oneShot(v,B.note[e.b],t,0.5,pr); t+=0.055}
          else{oneShot(v,B[e.type][e.b],t,0.6,pr); t+=len[e.type]}
          t+=e.gap;
        }
        v.next=t+(1.5+rand()*4)/v.p.rate;
      }
    }
  },
  frogs:{
    build(){},
    schedule(v,t1){
      while(v.next<t1){
        const r=0.8+0.45*rand();                      // each croak as a different frog
        oneShot(v,pick(BANKS.frogs),v.next,0.9+0.7*rand(),r);
        if(rand()<0.3) oneShot(v,pick(BANKS.frogs),v.next+0.2+rand()*0.4,0.5+0.5*rand(),0.8+0.45*rand());   // an answer
        v.next+=expRand(v.p.rate);
      }
    }
  },
  bowl:{
    f(v){return mtof({large:48,medium:60,small:72}[v.p.size]+MUSIC.root)},
    build(v){
      v.bo=null;
      if(v.p.style!=='sing') return;
      // rubbed rim: the two lowest modes sound continuously, each split into a slowly beating pair
      const f=this.f(v); v.sg=gn(0.22); v.bo=[];
      [[1,1,0.3+rand()*0.5],[2.71,0.35,1+rand()]].forEach(([r,a,beat])=>{
        for(const sgn of [-1,1]){
          const o=new OscillatorNode(ctx,{frequency:f*r+sgn*beat/2}), g=gn(a*0.5);
          o.connect(g).connect(v.sg); o.start(); v.loops.push(o); v.nodes.push(g); v.bo.push({o,r,sgn,beat});
        }
      });
      const lfo=new OscillatorNode(ctx,{frequency:0.06+rand()*0.04}), lg=gn(0.12);   // slow swell of the rubbing
      lfo.connect(lg).connect(v.sg.gain); lfo.start(); v.loops.push(lfo);
      const n=loop(v,WHITE), bp=bq('bandpass',f*2.71,6), ng=gn(0.02);             // faint friction noise
      n.connect(bp).connect(ng).connect(v.inp); v.fr=bp;
      v.sg.connect(v.inp); v.nodes.push(v.sg,lg,bp,ng);
    },
    retune(v){
      if(!v.bo) return;
      const f=this.f(v), now=ctx.currentTime;
      v.bo.forEach(b=>b.o.frequency.setTargetAtTime(f*b.r+b.sgn*b.beat/2,now,0.3));
      v.fr.frequency.setTargetAtTime(f*2.71,now,0.3);
    },
    update(v,key){if(key==='style'){v.stop(); v.start()} else if(key==='size') this.retune(v)},
    schedule(v,t1){
      if(v.p.style!=='strike'){v.next=t1; return}
      while(v.next<t1){
        // mode ratios of a typical bowl: 1 : 2.71 : 5.15 : 8.43
        modalStrike(v,v.next,this.f(v),[[1,1,12,0.3+rand()*0.9],[2.71,0.45,6,1+rand()*1.5],[5.15,0.22,3,1.5+rand()*2.5],[8.43,0.1,1.5,0]],0.3+0.15*rand(),v.p.ring);
        const bp=bq('bandpass',2500+rand()*1500,1.5); bp.connect(v.inp);
        burst(v.next,0.004,0.12,bp,{cleanup:[bp]});                                // mallet contact
        v.next+=60/v.p.rate*(0.75+0.5*rand());
      }
    }
  },
  kalimba:{
    build(v){v.state={deg:scaleLen(),left:4+rint(4)}},
    note(v,t,midi,amp){
      const f=mtof(midi);
      // steel tine: fundamental plus the clamped-bar overtone at 6.27×, which dies quickly
      modalStrike(v,t,f,[[1,1,0.9*Math.pow(523/f,0.3),0],[6.27,0.18,0.06,0]],amp);
      const bp=bq('bandpass',f*3,2); bp.connect(v.inp);
      burst(t,0.0015,0.05*amp,bp,{cleanup:[bp]});
    },
    schedule(v,t1){
      const s=v.state, beat=60/v.p.tempo, top=2*scaleLen();
      while(v.next<t1){
        if(s.left<=0){s.left=6+rint(7); v.next+=beat*(2+rint(3)); continue}   // rest between phrases
        let d=s.deg+pick([-2,-1,-1,0,1,1,2]);
        if(d<0||d>top) d=s.deg-(d-s.deg);                                     // bounce off the ends
        s.deg=clamp(d,0,top);
        const t=v.next+(rand()-0.5)*0.02;                                     // a little human timing
        this.note(v,t,scaleMidi(60,s.deg),0.35+0.15*rand());
        if(rand()<v.p.harmony) this.note(v,t+0.012,scaleMidi(60,s.deg+2),0.25);
        s.left--; v.next+=beat*pick([0.5,0.5,1,1,1,1.5,2]);
      }
    }
  },
  harp:{
    build(){},
    schedule(v,t1){
      const n=scaleLen(), pace=v.p.pace;
      while(v.next<t1){
        const i=rint(n), degs=[i,i+2,i+4,i+n,i+n+2];                         // a chord built from the scale
        const dir=v.p.dir==='both'?(rand()<0.5?'up':'down'):v.p.dir;
        if(dir==='down') degs.reverse();
        let t=v.next;
        for(const g of degs){playNote(v,BANKS.harp,scaleMidi(48,g),0.55+0.3*rand(),t,(rand()-0.5)*6); t+=(0.1+rand()*0.06)/pace}
        v.next=t+(1.2+rand()*1.6)/pace;
      }
    }
  },
  chimes:{
    build(v){v.state={last:2,ph:[rand()*6,rand()*6]}},
    gust(v,t){                                                                // slow, irregular wind strength in [0,1]
      const p=v.state.ph;
      return clamp(0.5+0.5*Math.sin(2*Math.PI*t/17+p[0])*Math.sin(2*Math.PI*t/7.3+p[1])+0.2*Math.sin(2*Math.PI*t/3.1),0,1);
    },
    schedule(v,t1){
      const s=v.state, base=v.p.tubes==='high'?72:60;
      while(v.next<t1){
        const tube=rand()<0.3?rint(6):clamp(s.last+pick([-2,-1,1,2]),0,5); s.last=tube;
        // free-free tube modes: 1 : 2.76 : 5.40
        modalStrike(v,v.next,mtof(scaleMidi(base,tube)),[[1,1,1.8,0],[2.76,0.5,0.9,0],[5.40,0.25,0.4,0]],0.12+0.2*rand()**1.5,v.p.ring);
        v.next+=expRand(0.15+5*v.p.wind*this.gust(v,v.next));
      }
    }
  },
  pad:{
    cut(v){return 250*Math.pow(12,v.p.bright)},                               // 250 Hz .. 3 kHz
    build(v){
      v.lp=bq('lowpass',this.cut(v),0.4); v.amp=gn(0.8);
      const lfo=new OscillatorNode(ctx,{frequency:0.05}), lg=gn(600);          // cutoff drifts ±½ octave
      lfo.connect(lg).connect(v.lp.detune);
      const al=new OscillatorNode(ctx,{frequency:0.07}), ag=gn(0.2);          // slow swell
      al.connect(ag).connect(v.amp.gain);
      const mg=new ChannelMergerNode(ctx,{numberOfInputs:2});
      v.po=[];
      for(let j=0;j<4;j++) for(const [ch,det] of [[0,-7],[1,7]]){             // each chord tone: two saws, detuned, one per ear
        const o=new OscillatorNode(ctx,{type:'sawtooth',detune:det+(rand()-0.5)*4}), g=gn(0.045);
        o.connect(g).connect(mg,0,ch); o.start(); v.loops.push(o); v.nodes.push(g); v.po.push({o,j});
      }
      lfo.start(); al.start(); v.loops.push(lfo,al);
      mg.connect(v.lp).connect(v.amp).connect(v.inp); v.nodes.push(mg,v.lp,v.amp,lg,ag);
      v.state={i:0}; this.chord(v,ctx.currentTime,0.01);
      v.next=ctx.currentTime+60/v.p.change;
    },
    chord(v,t,glide){
      const i=v.state.i, ms=[scaleMidi(36,i),scaleMidi(48,i),scaleMidi(48,i+2),scaleMidi(48,i+4)];
      v.po.forEach(({o,j})=>o.frequency.setTargetAtTime(mtof(ms[j]),t,glide));
    },
    retune(v){this.chord(v,ctx.currentTime,0.3)},
    update(v,key){
      if(key==='bright') v.lp.frequency.setTargetAtTime(this.cut(v),ctx.currentTime,0.1);
      else if(key==='spread'){v.stop(); v.start()}
    },
    schedule(v,t1){
      while(v.next<t1){
        const n=scaleLen(); let i;
        do{i=rint(n)}while(i===v.state.i&&n>1);
        v.state.i=i; this.chord(v,v.next,1.2);                                // chords melt into each other
        v.next+=60/v.p.change*(0.8+0.4*rand());
      }
    }
  },
  whisper:{
    // source-filter model with noise excitation: whisper = speech without voicing.
    // Softness comes from: wide (non-whistling) formants, a dark tilt, slow envelopes, quiet consonants.
    build(v){
      const s=loop(v,WHITE);
      v.fx=bq('lowpass',6000,0.5);                        // shared softening path for consonants and breaths
      const lp=bq('lowpass',3600,0.5), hs=bq('highshelf',2500);
      hs.gain.value=-5;
      v.vg=gn(0); v.F=[];
      VOWELS[0].forEach((f,i)=>{const b=bq('bandpass',f,[3.5,4.5,5][i]), g=gn([2.6,1.5,0.7][i]); s.connect(b).connect(g).connect(v.vg); v.F.push(b); v.nodes.push(b,g)});
      const air=bq('bandpass',1100,0.7), ag=gn(0.35);        // broad breathy layer under the formants
      s.connect(air).connect(ag).connect(v.vg);
      v.vg.connect(lp).connect(hs).connect(v.inp);
      v.fx.connect(v.inp);
      v.cf=CONS.map(c=>c.f?bq('bandpass',c.f,c.q??0.8):null);  // one filter per consonant, reused
      v.bf=bq('bandpass',1200,0.6);
      [...v.cf.filter(Boolean),v.bf].forEach(f=>{f.connect(v.fx); v.nodes.push(f)});
      v.nodes.push(v.fx,lp,hs,v.vg,air,ag); v.state={syl:0,words:0};
    },
    syllable(v,t,sp){
      const ci=rint(CONS.length), c=CONS[ci], vw=pick(VOWELS); let tt=t, onset=0.035;
      if(c.type==='fric'){const d=(0.1+rand()*0.08)/sp; burst(tt,d,c.a,v.cf[ci],{attack:d*0.5}); tt+=d*0.75}
      else if(c.type==='stop'){tt+=0.04/sp; burst(tt,0.04,c.a,v.cf[ci],{attack:0.008}); tt+=0.03}
      else if(c.type==='h') onset=0.07;
      const vd=(0.16+rand()*0.16)/sp;
      v.F.forEach((b,i)=>b.frequency.setTargetAtTime(vw[i]*v.p.tract,Math.max(t,tt-0.02),0.03));
      v.vg.gain.setTargetAtTime(0.45+rand()*0.2,tt,onset);
      v.vg.gain.setTargetAtTime(0,tt+vd-0.05,0.06);
      return (tt-t)+vd+0.04;
    },
    breath(v,t){burst(t,1.1,0.05,v.bf,{attack:0.45})},
    schedule(v,t1){
      const s=v.state, sp=v.p.pace;
      while(v.next<t1){
        if(s.syl<=0){
          if(s.words<=0){this.breath(v,v.next); v.next+=(1.6+rand()*1.4)/sp; s.words=3+rint(3)}
          else v.next+=(0.25+rand()*0.4)/sp;
          s.syl=1+rint(3); s.words--; continue;
        }
        v.next+=this.syllable(v,v.next,sp); s.syl--;
      }
    }
  }
};

class Voice{
  constructor(def){
    this.def=def; this.p={hp:0,lp:1,slope:'12',res:0,...def.p}; this.phase=rand()*6.283; this.active=false;
    this.u0=0; this.t0=0; this.w=this.p.speed*Math.PI/180;       // motion phase u(t) = u0 + w·(t - t0)
  }
  motion(t){return this.u0+this.w*(t-this.t0)}
  // Speed changed: re-anchor the phase where the already-scheduled path ends, so the sound doesn't jump
  retime(){
    const tc=this.active?Math.max(this.posT,ctx.currentTime):(ctx?ctx.currentTime:0);
    this.u0=this.motion(tc); this.t0=tc; this.w=this.p.speed*Math.PI/180;
  }
  val(key,t){const L=LINKS.get(this.def.id+'.'+key); return L?linkValue(L,t):this.p[key]}
  drivenPos(){return LINKS.has(this.def.id+'.angle')||LINKS.has(this.def.id+'.dist')}
  // position at time t (metres); listener at origin facing -z; angle 0 = front, +90 = right ear
  pos(t){
    const p=this.p, u=this.motion(t); let th=this.val('angle',t)*Math.PI/180, d=this.val('dist',t);
    if(p.mode==='orbit') th+=u;
    else if(p.mode==='sweep') th=(Math.PI/2)*Math.sin(0.5*u+this.phase);            // ear to ear through the front
    else if(p.mode==='wander'){th+=Math.sin(0.37*u+this.phase)+0.6*Math.sin(0.91*u); d*=1+0.35*Math.sin(0.53*u+2*this.phase)}
    d=Math.max(0.12,d);
    return {x:d*Math.sin(th),z:-d*Math.cos(th),d};
  }
  async start(){
    const token=this.token=(this.token||0)+1;
    await ensureBank(this.def.id);                   // bake this sound's variants the first time
    if(token!==this.token||!this.p.on||this.active) return;
    const now=ctx.currentTime; this.loops=[]; this.nodes=[];
    this.inp=gn(0);
    this.shelf=bq('lowshelf',220);                      // proximity effect: bass lift when very close
    this.panner=new PannerNode(ctx,{panningModel:'HRTF',distanceModel:'inverse',refDistance:0.25,maxDistance:20,rolloffFactor:1});
    this.flt=['highpass','highpass','lowpass','lowpass'].map(type=>new BiquadFilterNode(ctx,{type}));
    applyFilter(this,true);
    const out=this.flt.reduce((a,f)=>a.connect(f),this.inp);
    if(this.p.spread==='wide') out.connect(master);
    else out.connect(this.shelf).connect(this.panner).connect(master);
    this.nodes.push(this.inp,...this.flt,this.shelf,this.panner);
    this.inp.gain.setTargetAtTime(this.p.vol,now,0.1);
    const q=this.pos(now);
    this.panner.positionX.setValueAtTime(q.x,now); this.panner.positionY.setValueAtTime(0,now); this.panner.positionZ.setValueAtTime(q.z,now);
    this.posT=now; this.posDirty=false; this.next=now+0.1;

  }
  stop(){
    this.token=(this.token||0)+1;
    if(!this.active) return; this.active=false;
    const loops=this.loops, nodes=this.nodes;
    this.inp.gain.setTargetAtTime(0,ctx.currentTime,0.04);
    setTimeout(()=>{loops.forEach(s=>{try{s.stop()}catch(e){}}); nodes.forEach(n=>n.disconnect())},400);

  rampTo(t){
    const q=this.pos(t);

    this.panner.positionZ.linearRampToValueAtTime(q.z,t);
    this.shelf.gain.linearRampToValueAtTime(clamp(10*(0.6-q.d)/0.45,0,10),t);

  anchorPos(t){[this.panner.positionX,this.panner.positionZ,this.shelf.gain].forEach(a=>a.setValueAtTime(a.value,t))}
  schedulePos(t1){
    const now=ctx.currentTime;
    if(this.p.spread==='wide'){this.posT=t1; return}            // panner not in use
    const stat=this.p.mode==='static'&&!this.drivenPos();
    if(stat&&!this.posDirty) return;                            // still: only move when something changed
    let t=this.posT;
    if(t<now){t=now; this.anchorPos(now)}
    if(stat){this.rampTo(t+0.03); this.posT=t+0.03; this.posDirty=false; return}   // ~30 ms response
    while(t<t1){t+=0.04; this.rampTo(t)}

  }
}
const voices=DEFS.map(d=>new Voice(d));

function tick(){
  if(!ctx||ctx.state!=='running') return;
  const now=ctx.currentTime, t1=now+0.25;
  applyLinks(now);
  for(const v of voices){
    if(!v.active) continue;
    if(v.next<now-0.3) v.next=now+0.02;
    if(v.posT<now-0.3) v.posT=now;
    GEN[v.def.id].schedule(v,t1);
    v.schedulePos(t1);
  }
}

// 25 ms clock in a Worker (less throttled than page timers); run(false) stops it while paused
function makeClock(){
  try{
    const src='let id=0;onmessage=e=>{clearInterval(id);id=e.data?setInterval(()=>postMessage(0),25):0}';
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    w.onmessage=tick;
    return {run:on=>w.postMessage(on?1:0)};
  }catch(e){
    let id=0;
    return {run:on=>{clearInterval(id); id=on?setInterval(tick,25):0}};
  }
}
async function initAudio(){
  ctx=new AudioContext({latencyHint:'playback'});      // created inside the click, before any await
  const comp=new DynamicsCompressorNode(ctx,{threshold:-18,ratio:4,attack:0.005,release:0.2});
  master=gn(+document.getElementById('master').value); master.connect(comp).connect(ctx.destination);
  WHITE=makeNoise(4,false); BROWN=makeNoise(4,true);
  ready=true;
  await Promise.all(voices.filter(v=>v.p.on).map(v=>v.start()));
  clock=makeClock();
}

const AN=new OfflineAudioContext(1,1,48000);
const AN_F=['highpass','highpass','lowpass','lowpass'].map(type=>new BiquadFilterNode(AN,{type}));
const NF=256, FREQS=Float32Array.from({length:NF},(_,i)=>20*Math.pow(1000,i/(NF-1)));
const MAG=new Float32Array(NF), PH=new Float32Array(NF), TOT=new Float32Array(NF);
function drawBode(v){
  const cvs=v.ui.plot, k=window.devicePixelRatio||1, W=Math.round(cvs.clientWidth*k), H=Math.round(cvs.clientHeight*k);
  if(!W||!H) return;
  if(cvs.width!==W||cvs.height!==H){cvs.width=W; cvs.height=H}
  const S=filterSettings(v.p,AN.sampleRate/2);
  TOT.fill(1);
  AN_F.forEach((f,i)=>{f.frequency.value=S[i].f; f.Q.value=S[i].q; f.getFrequencyResponse(FREQS,MAG,PH); for(let j=0;j<NF;j++) TOT[j]*=MAG[j]});
  const top=24, bot=-48, X=f=>Math.log10(f/20)/3*W, Y=d=>(top-clamp(d,bot,top))/(top-bot)*H;
  const g=cvs.getContext('2d');
  g.clearRect(0,0,W,H);
  g.lineWidth=k; g.strokeStyle='rgba(138,155,165,.25)'; g.fillStyle='rgba(138,155,165,.8)'; g.font=`${10*k}px system-ui,sans-serif`;
  [100,1000,10000].forEach(f=>{g.beginPath(); g.moveTo(X(f),0); g.lineTo(X(f),H); g.stroke(); g.fillText(fmtHz(f),X(f)+3*k,H-4*k)});
  [0,-24].forEach(d=>{g.beginPath(); g.moveTo(0,Y(d)); g.lineTo(W,Y(d)); g.stroke(); g.fillText(d+' dB',3*k,Y(d)-3*k)});
  g.strokeStyle=v.def.color; g.lineWidth=2*k; g.beginPath();
  for(let j=0;j<NF;j++){const x=X(FREQS[j]), y=Y(20*Math.log10(TOT[j]+1e-9)); j?g.lineTo(x,y):g.moveTo(x,y)}

}

/* ---------------- Register pattern ----------------
   Record the movement of a slider (sampled at 50 Hz) and loop it onto any
   slider of any sound. Patterns are kept in this browser's localStorage. */
const PDT=0.02, PMAX=3000;                                  // 50 Hz, max 60 s
const PATTERNS=(()=>{try{return JSON.parse(localStorage.getItem('hush.patterns')||'[]')}catch(e){return []}})();
const savePatterns=()=>{try{localStorage.setItem('hush.patterns',JSON.stringify(PATTERNS))}catch(e){}};
const linkSpeed=x=>0.25*Math.pow(16,x);                     // 0.25x .. 4x, log scale
function patternAt(P,pos){                                  // pos in samples, loops, linear interpolation
  const n=P.values.length, x=((pos%n)+n)%n, i=Math.floor(x), f=x-i;
  return P.values[i]+(P.values[(i+1)%n]-P.values[i])*f;
}
function linkValue(L,t){return L.param.min+(L.param.max-L.param.min)*patternAt(L.pat,(t-L.t0)*L.speed/PDT)}
function applyLinks(t){
  for(const L of LINKS.values()){L.param.input.value=linkValue(L,t); L.param.input.dispatchEvent(new Event('input'))}
}
function drawCurve(cvs,values,color){
  const k=window.devicePixelRatio||1, W=Math.round(cvs.clientWidth*k), H=Math.round(cvs.clientHeight*k);
  if(!W||!H) return;
  if(cvs.width!==W||cvs.height!==H){cvs.width=W; cvs.height=H}
  const g=cvs.getContext('2d'); g.clearRect(0,0,W,H);

  values.forEach((y,i)=>{const X=i/n*W, Y=pad+(1-y)*(H-2*pad); i?g.lineTo(X,Y):g.moveTo(X,Y)});
  g.stroke();
}
/* Generated patterns. All return n samples in [0,1] that loop seamlessly.
   Periodic shapes are exact functions of the phase; random ones are built periodic
   (random Fourier series, periodic knots) or corrected at the seam (Brownian bridge). */
const gauss=()=>Math.sqrt(-2*Math.log(1-rand()))*Math.cos(2*Math.PI*rand());
const normalize=a=>{let lo=Infinity,hi=-Infinity; for(const x of a){lo=Math.min(lo,x);hi=Math.max(hi,x)} const r=hi-lo||1; return a.map(x=>(x-lo)/r)};
const bridge=a=>{const n=a.length, d=a[n-1]-a[0]; return a.map((x,i)=>x-d*i/(n-1))};   // end meets start
const phases=n=>Array.from({length:n},(_,i)=>i/n);
const GENS={
  sine:    {label:'Sine',          periodic:true, make:(n)=>phases(n).map(u=>0.5-0.5*Math.cos(2*Math.PI*u))},
  triangle:{label:'Triangle',      periodic:true, make:(n)=>phases(n).map(u=>u<0.5?2*u:2-2*u)},
  sawUp:   {label:'Ramp up',       periodic:true, make:(n)=>phases(n)},
  sawDown: {label:'Ramp down',     periodic:true, make:(n)=>phases(n).map(u=>1-u)},
  square:  {label:'Square',        periodic:true, make:(n)=>phases(n).map(u=>u<0.5?1:0)},
  pulse:   {label:'Pulse',         periodic:true, make:(n)=>phases(n).map(u=>u<0.15?1:0)},
  breath:  {label:'Breathing',     periodic:true, make:(n)=>phases(n).map(u=>u<0.4?Math.sin(Math.PI*u/0.8)**2:Math.cos(Math.PI*(u-0.4)/1.2)**2)},  // quick in, slow out
  smooth:  {label:'Smooth random', make:(n,k)=>{            // k random knots on a circle, cosine interpolation
    const K=Math.max(2,k), knots=Array.from({length:K},rand);
    return phases(n).map(u=>{const x=u*K, i=Math.floor(x), f=(1-Math.cos(Math.PI*(x-i)))/2; return knots[i]+(knots[(i+1)%K]-knots[i])*f});
  }},
  steps:   {label:'Random steps',  make:(n,k)=>{            // sample and hold
    const K=Math.max(2,k), lv=Array.from({length:K},rand);
    return phases(n).map(u=>lv[Math.floor(u*K)]);
  }},
  walk:    {label:'Random walk',   make:(n,k)=>{            // Brownian motion, bridged so the loop closes
    const K=Math.max(2,k), w=[0]; for(let i=1;i<=K;i++) w.push(w[i-1]+gauss());
    const b=bridge(w);
    return normalize(phases(n).map(u=>{const x=u*K, i=Math.floor(x); return b[i]+(b[i+1]-b[i])*(x-i)}));
  }},
  pink:    {label:'1/f drift',     make:(n,k)=>{            // random Fourier series, amplitude ∝ 1/√f: periodic by construction
    const K=Math.max(2,k), a=[], ph=[];
    for(let m=1;m<=K;m++){a.push(1/Math.sqrt(m)); ph.push(rand()*2*Math.PI)}
    return normalize(phases(n).map(u=>a.reduce((s,am,m)=>s+am*Math.sin(2*Math.PI*(m+1)*u+ph[m]),0)));
  }},
  ou:      {label:'Ornstein–Uhlenbeck', make:(n,k,len)=>{   // mean-reverting noise, rate θ = k/len
    const th=Math.max(0.2,k/len), sig=0.18*Math.sqrt(2*th), x=[0.5];
    for(let i=1;i<n;i++) x.push(x[i-1]+th*(0.5-x[i-1])*PDT+sig*Math.sqrt(PDT)*gauss());
    return bridge(x).map(v=>clamp(v,0,1));
  }},
  spikes:  {label:'Random bursts', make:(n,k)=>{            // Poisson events with exponential decay, wrapped around the loop
    const out=new Array(n).fill(0), tau=Math.round(0.15/PDT), m=Math.max(1,k);
    for(let e=0;e<m;e++){
      const t0=Math.floor(rand()*n), h=0.4+0.6*rand();
      for(let j=0;j<6*tau;j++){const idx=(t0+j)%n; out[idx]=Math.max(out[idx],h*Math.exp(-j/tau))}
    }
    return out;
  }}
};
const genLen=x=>0.5*Math.pow(120,x);      // 0.5 .. 60 s
const genRate=x=>0.2*Math.pow(50,x);      // 0.2 .. 10 changes per second

function buildPatternPanel(){
  const take=el('canvas',{className:'take'});
  take.setAttribute('aria-label','Recorded movement');
  const pad=el('input',{type:'range',min:0,max:1,step:0.001,value:0.5,className:'pad'});
  pad.setAttribute('aria-label','Pattern slider');
  const recBtn=el('button',{className:'btn',textContent:'Record'});
  const recMsg=el('span',{className:'note',textContent:'Press Record, then move the slider. Press Stop when done.'});
  // generator controls
  const gShape=el('select');
  const gP=el('optgroup',{label:'Periodic'}), gR=el('optgroup',{label:'Random'});
  for(const [k,G] of Object.entries(GENS)) (G.periodic?gP:gR).append(new Option(G.label,k));
  gShape.append(gP,gR);
  const gSlider=(label,x,fmt)=>{
    const r=el('input',{type:'range',min:0,max:1,step:0.005,value:x}), o=el('b',{textContent:fmt(x)});
    r.addEventListener('input',()=>o.textContent=fmt(+r.value));
    return {r,box:el('label',{className:'ctrl'},el('span',{},label,o),r)};
  };
  const gLen=gSlider('Length',Math.log(4/0.5)/Math.log(120),x=>genLen(x).toFixed(1)+' s');
  const gRate=gSlider('Changes per second',Math.log(1/0.2)/Math.log(50),x=>genRate(x).toFixed(1));
  const gLo=gSlider('Lowest',0,x=>Math.round(x*100)+'%'), gHi=gSlider('Highest',1,x=>Math.round(x*100)+'%');
  const genBtn=el('button',{className:'btn',textContent:'Generate'});
  const syncGen=()=>{const per=!!GENS[gShape.value]?.periodic; gRate.box.style.opacity=per?0.4:1; gRate.r.disabled=per;
    gLen.box.firstChild.firstChild.textContent=per?'Period':'Length'};
  gShape.addEventListener('change',syncGen);
  const plist=el('ul',{className:'plist'}), pEmpty=el('p',{className:'empty',textContent:'No patterns yet.'});
  const selPat=el('select'), selSound=el('select'), selKey=el('select');
  const spd=el('input',{type:'range',min:0,max:1,step:0.01,value:0.5}), spdOut=el('b',{textContent:'1.00×'});
  const applyBtn=el('button',{className:'btn',textContent:'Apply'});
  const nowList=el('div'), nowEmpty=el('p',{className:'empty',textContent:'Nothing is switched on.'});
  const stopAll=el('button',{className:'btn',textContent:'Stop all patterns'});
  stopAll.addEventListener('click',()=>{[...LINKS.keys()].forEach(unlink); renderLinks()});
  const allOff=el('button',{className:'btn',textContent:'Turn everything off'});
  allOff.addEventListener('click',()=>voices.forEach(v=>{if(v.p.on){v.ui.sw.checked=false; v.ui.sw.dispatchEvent(new Event('change'))}}));
  const nowActions=el('div',{className:'np-actions'},allOff,stopAll);
  sectionOf.now.append(nowEmpty,nowList,nowActions);
  const lab=(t,...kids)=>el('label',{className:'ctrl'},t,...kids);
  const spdLab=el('label',{className:'ctrl'},el('span',{},'Speed',spdOut),spd);

  const panel=el('article',{className:'src pattern'},
    el('div',{className:'src-head'},el('span',{className:'dot',style:'background:var(--lilac)'}),el('h2',{textContent:'Register pattern'})),
    el('div',{className:'body'},
      take,pad,el('div',{className:'row'},recBtn,recMsg),
      el('h3',{textContent:'Or generate one'}),
      el('div',{className:'ctrls',style:'margin-left:0'},el('label',{className:'ctrl'},'Shape',gShape),gLen.box,gRate.box,gLo.box,gHi.box),
      el('div',{className:'row',style:'margin-top:12px'},genBtn),
      el('h3',{textContent:'Saved patterns'}),pEmpty,plist,
      el('h3',{textContent:'Use a pattern'}),
      el('div',{className:'ctrls',style:'margin-left:0'},lab('Pattern',selPat),lab('Sound',selSound),lab('Setting',selKey),spdLab),
      el('div',{className:'row',style:'margin-top:12px'},applyBtn)));
  sectionOf.patterns.append(panel);

  // ----- recording
  let rec=null;
  const stopRec=()=>{
    clearInterval(rec.timer);
    const vals=rec.values; rec=null;
    recBtn.textContent='Record'; recBtn.classList.remove('rec');
    if(vals.length<10){recMsg.textContent='Too short, nothing saved. Try again.'; return}
    addPattern(vals,'Pattern');
  };
  function addPattern(vals,base){
    const num=1+PATTERNS.reduce((m,P)=>{
      const rest=P.name.startsWith(base+' ')?P.name.slice(base.length+1):'';
      return /^\d+$/.test(rest)?Math.max(m,+rest):m;
    },0);
    const P={id:Date.now().toString(36)+rint(1e6).toString(36),name:base+' '+num,values:vals.map(x=>Math.round(x*1000)/1000)};
    PATTERNS.push(P); savePatterns(); renderPatterns(); selPat.value=P.id;
    drawCurve(take,P.values,'#B9A3E3');
    recMsg.textContent=`Saved "${P.name}", ${(vals.length*PDT).toFixed(1)} s.`;
  }
  genBtn.addEventListener('click',()=>{
    const G=GENS[gShape.value], len=genLen(+gLen.r.value), n=Math.min(PMAX,Math.max(10,Math.round(len/PDT)));
    const k=Math.round(genRate(+gRate.r.value)*n*PDT);
    const lo=+gLo.r.value, hi=+gHi.r.value;
    addPattern(G.make(n,k,n*PDT).map(v=>lo+(hi-lo)*v),G.label);
  });
  syncGen();
  recBtn.addEventListener('click',()=>{
    if(rec){stopRec(); return}
    rec={armed:true,values:[]}; drawCurve(take,[],'');
    recBtn.textContent='Stop'; recBtn.classList.add('rec');
    recMsg.textContent='Move the slider to start recording…';
  });
  pad.addEventListener('input',()=>{
    if(!rec||!rec.armed) return;
    rec.armed=false;                                          // recording starts on the first movement
    const sample=()=>{
      rec.values.push(+pad.value); drawCurve(take,rec.values,'#B9A3E3');
      recMsg.textContent=`Recording… ${(rec.values.length*PDT).toFixed(1)} s`;
      if(rec.values.length>=PMAX) stopRec();
    };
    rec.timer=setInterval(sample,PDT*1000); sample();
  });

  // ----- saved patterns
  function renderPatterns(){
    const keep=selPat.value;
    plist.replaceChildren(); selPat.replaceChildren();
    pEmpty.hidden=PATTERNS.length>0;
    for(const P of PATTERNS){
      const c=el('canvas'), name=el('input',{type:'text',value:P.name});
      name.setAttribute('aria-label','Pattern name');
      name.addEventListener('change',()=>{P.name=name.value.trim()||P.name; savePatterns(); renderPatterns(); renderLinks()});
      const del=el('button',{className:'btn',textContent:'Delete'});
      del.addEventListener('click',()=>{
        for(const [k,L] of LINKS) if(L.pat===P) unlink(k);
        PATTERNS.splice(PATTERNS.indexOf(P),1); savePatterns(); renderPatterns(); renderLinks();
      });
      plist.append(el('li',{},c,name,el('span',{className:'note',textContent:(P.values.length*PDT).toFixed(1)+' s'}),del));
      requestAnimationFrame(()=>drawCurve(c,P.values,'#B9A3E3'));
      selPat.append(new Option(P.name,P.id,false,P.id===keep));
    }
    applyBtn.disabled=!PATTERNS.length;
  }

  // ----- targets
  voices.forEach(v=>selSound.append(new Option(v.def.name,v.def.id)));
  const fillKeys=()=>{
    selKey.replaceChildren();
    PARAMS.filter(q=>q.v.def.id===selSound.value).forEach(q=>selKey.append(new Option(q.label,q.key)));
  };
  selSound.addEventListener('change',fillKeys); fillKeys();
  spd.addEventListener('input',()=>spdOut.textContent=linkSpeed(+spd.value).toFixed(2)+'×');

  onPlaceByHand=v=>{
    const had=['angle','dist'].map(key=>v.def.id+'.'+key).filter(k=>LINKS.has(k));
    had.forEach(unlink); if(had.length) renderLinks();
  };
  function unlink(k){
    const L=LINKS.get(k); if(!L) return;
    LINKS.delete(k); L.param.el.classList.remove('driven'); L.param.v.posDirty=true;
  }
  applyBtn.addEventListener('click',()=>{
    const pat=PATTERNS.find(P=>P.id===selPat.value);
    const param=PARAMS.find(q=>q.v.def.id===selSound.value&&q.key===selKey.value);
    if(!pat||!param) return;
    const k=selSound.value+'.'+selKey.value; unlink(k);
    const L={pat,param,speed:linkSpeed(+spd.value),t0:ctx?ctx.currentTime:0};
    LINKS.set(k,L); param.el.classList.add('driven');
    if(param.key==='speed') param.v.retime();
    applyLinks(L.t0); renderLinks();
  });
  // One block per sound that is on: volume, off switch, and the patterns driving it
  function patternRow(k,L){
    const c=el('canvas'), head=el('div',{className:'head'}), now=el('span',{className:'now'});
    const meta=el('div',{className:'meta'},el('b',{textContent:L.pat.name}),el('br'),`${L.param.label}: `,now);
    const x0=Math.log(L.speed/0.25)/Math.log(16);
    const sp=el('input',{type:'range',min:0,max:1,step:0.01,value:x0}), spOut=el('b',{textContent:L.speed.toFixed(2)+'×'});
    sp.addEventListener('input',()=>{                 // change speed without jumping in the loop
      const t=ctx?ctx.currentTime:0, ns=linkSpeed(+sp.value);
      L.t0=t-(t-L.t0)*L.speed/ns; L.speed=ns; spOut.textContent=ns.toFixed(2)+'×';
    });
    const rm=el('button',{className:'btn',textContent:'Remove'});
    rm.addEventListener('click',()=>{unlink(k); renderLinks()});
    L.ui={head,now};
    requestAnimationFrame(()=>drawCurve(c,L.pat.values,L.param.v.def.color));
    return el('li',{},el('div',{className:'curve'},c,head),meta,el('label',{className:'ctrl'},el('span',{},'Speed',spOut),sp),rm);
  }
  function renderLinks(){
    nowList.replaceChildren();
    const on=voices.filter(v=>v.p.on);
    nowEmpty.hidden=on.length>0; allOff.hidden=!on.length; stopAll.hidden=LINKS.size===0;
    for(const v of on){
      const d=v.def;
      const name=el('button',{className:'np-name',textContent:d.name,title:'Show its settings'});
      name.addEventListener('click',()=>{
        showSection(d.group); v.ui.settings.open=true;
        v.ui.box.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});
      });
      const vol=el('input',{type:'range',min:0,max:1,step:0.01,value:v.p.vol});
      vol.setAttribute('aria-label',d.name+' volume');
      vol.addEventListener('input',()=>setSlider(v,'vol',vol.value));
      v.ui.nowVol=vol;
      const off=el('button',{className:'btn',textContent:'Off'});
      off.addEventListener('click',()=>{v.ui.sw.checked=false; v.ui.sw.dispatchEvent(new Event('change'))});
      const rows=[...LINKS].filter(([,L])=>L.param.v===v);
      const block=el('div',{className:'np'},
        el('div',{className:'np-head'},el('span',{className:'dot',style:`background:${d.color}`}),name,el('div',{className:'vol'},vol),off));
      if(rows.length) block.append(el('ul',{className:'playing'},...rows.map(([k,L])=>patternRow(k,L))));
      nowList.append(block);
    }
    for(const v of voices) if(!v.p.on) v.ui.nowVol=null;
    updateCounts();
    updatePlaying();
  }
  renderNow=renderLinks;


  renderPatterns(); renderLinks();
  new ResizeObserver(()=>{if(rec) return; renderPatterns()}).observe(plist);
}
buildPatternPanel();
showSection('now');

const playBtn=document.getElementById('play'), status=document.getElementById('status');
playBtn.addEventListener('click',async()=>{
  const first=!ctx;
  if(first){
    playBtn.disabled=true; status.textContent='Preparing sounds…';
    await initAudio();
    playBtn.disabled=false;
  }
  // a fresh context is often already 'running', so the first click must always start, never pause
  if(!first&&ctx.state==='running'){
    clock.run(false); await ctx.suspend();
    playBtn.textContent='Resume'; playBtn.setAttribute('aria-pressed','false'); status.textContent='Paused.';
  }else{
    await ctx.resume(); clock.run(true); requestDraw();
    playBtn.textContent='Pause'; playBtn.setAttribute('aria-pressed','true'); status.textContent='Playing. Move the sliders while you listen.';
  }
});
document.getElementById('master').addEventListener('input',e=>{if(master) master.gain.setTargetAtTime(+e.target.value,ctx.currentTime,0.05)});

/* ---------------- head map ---------------- */
// Redrawn every frame only while audio runs; otherwise only after a change.
const cv=document.getElementById('map'), g2=cv.getContext('2d');
let rafId=0;
function requestDraw(){ if(!rafId) rafId=requestAnimationFrame(frame) }
function updatePlaying(){
  const t=ctx?ctx.currentTime:0;
  for(const L of LINKS.values()){
    if(!L.ui) continue;
    const n=L.pat.values.length, x=((((t-L.t0)*L.speed/PDT)%n)+n)%n;
    L.ui.head.style.left=(x/n*100)+'%';
    L.ui.now.textContent=L.param.el.querySelector('b')?.textContent??'';
  }
}
function frame(){
  rafId=0; draw(); updatePlaying();
  if(ctx&&ctx.state==='running') requestDraw();
}
function fitCanvas(){
  const px=Math.round(cv.clientWidth*(window.devicePixelRatio||1));
  if(px>0&&cv.width!==px){cv.width=cv.height=px; requestDraw()}
}
new ResizeObserver(fitCanvas).observe(cv);
function mapGeom(){const W=cv.width; return {W,u:W/720,C:W/2,R:W*0.44}}   // u: scale for fixed sizes
function screenPos(v,t,G){
  const q=v.pos(t), r=G.R*Math.sqrt(Math.min(q.d,2.5)/2.5), k=r/q.d;    // square-root distance scale
  return {x:G.C+q.x*k,y:G.C+q.z*k};
}
let dragV=null, hoverV=null;
function draw(){
  const G=mapGeom(), {W,u,C,R}=G, t=ctx?ctx.currentTime:0;
  g2.clearRect(0,0,W,W);
  g2.strokeStyle='rgba(138,155,165,.18)'; g2.lineWidth=1.5*u;
  [0.25,0.5,1,2.5].forEach(m=>{g2.beginPath(); g2.arc(C,C,R*Math.sqrt(m/2.5),0,7); g2.stroke()});
  // head, nose (front = up), ears
  g2.fillStyle='#E6E1D3';
  g2.beginPath(); g2.moveTo(C-10*u,C-30*u); g2.lineTo(C,C-46*u); g2.lineTo(C+10*u,C-30*u); g2.fill();
  g2.beginPath(); g2.ellipse(C-33*u,C,7*u,13*u,0,0,7); g2.fill();
  g2.beginPath(); g2.ellipse(C+33*u,C,7*u,13*u,0,0,7); g2.fill();
  g2.beginPath(); g2.arc(C,C,34*u,0,7); g2.fill();
  let label=null;
  for(const v of voices){
    if(!v.p.on) continue;
    if(v.p.spread==='wide'){g2.strokeStyle=v.def.color+'55'; g2.lineWidth=14*u; g2.beginPath(); g2.arc(C,C,R*0.97,0,7); g2.stroke(); continue}
    const {x,y}=screenPos(v,t,G), big=v===dragV||v===hoverV;
    g2.fillStyle=v.def.color+(big?'55':'33'); g2.beginPath(); g2.arc(x,y,(big?30:26)*u,0,7); g2.fill();
    g2.fillStyle=v.def.color; g2.beginPath(); g2.arc(x,y,11*u,0,7); g2.fill();
    if(big) label={v,x,y};
  }
  if(label){
    const {v,x,y}=label, text=v.def.name, left=x>C;
    g2.font=`500 ${14*u}px system-ui,sans-serif`; g2.fillStyle='#E6E1D3';
    g2.textAlign=left?'right':'left'; g2.textBaseline='middle';
    g2.fillText(text,x+(left?-36:36)*u,y);
    g2.textAlign='left';
  }
}

/* Dragging a dot places that sound: its Direction and Distance sliders follow the pointer.
   A moving sound switches to "Still", and patterns on its position are removed. */
const toCanvas=e=>{const b=cv.getBoundingClientRect(); return {x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}};
function hitDot(p){
  const G=mapGeom(), t=ctx?ctx.currentTime:0; let best=null, bd=32*G.u;
  for(const v of voices){
    if(!v.p.on||v.p.spread==='wide') continue;
    const s=screenPos(v,t,G), d=Math.hypot(s.x-p.x,s.y-p.y);
    if(d<=bd){best=v; bd=d}                            // nearest, later (top-most) dots win ties
  }
  return best;
}
function setSlider(v,key,val){
  const q=PARAMS.find(x=>x.v===v&&x.key===key);
  q.input.value=val; q.input.dispatchEvent(new Event('input'));
}
function placeAt(v,p){
  const G=mapGeom(), dx=p.x-G.C, dy=p.y-G.C, r=Math.min(Math.hypot(dx,dy),G.R);
  setSlider(v,'angle',Math.round(Math.atan2(dx,-dy)*180/Math.PI));      // 0 = front, +90 = right
  setSlider(v,'dist',Math.max(0.12,2.5*(r/G.R)**2).toFixed(2));          // inverse of the square-root scale
}
cv.addEventListener('pointerdown',e=>{
  const v=hitDot(toCanvas(e)); if(!v) return;
  e.preventDefault(); dragV=v; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing';
  if(v.p.mode!=='static'){const m=SELECTS.find(x=>x.v===v&&x.key==='mode'); m.s.value='static'; m.s.dispatchEvent(new Event('change'))}
  onPlaceByHand?.(v);
  placeAt(v,toCanvas(e));
});
cv.addEventListener('pointermove',e=>{
  const p=toCanvas(e);
  if(dragV){placeAt(dragV,p); return}
  const h=hitDot(p);
  if(h!==hoverV){hoverV=h; cv.style.cursor=h?'grab':''; requestDraw()}
});
const endDrag=()=>{if(!dragV) return; dragV=null; cv.style.cursor=hoverV?'grab':''; requestDraw()};
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',()=>{if(!dragV&&hoverV){hoverV=null; cv.style.cursor=''; requestDraw()}});
fitCanvas(); requestDraw();
</script>
</body>
